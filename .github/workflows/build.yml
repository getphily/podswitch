name: Build PodSwitch — macOS

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  release:
    types: [published]

env:
  OBS_VERSION: "30.2.2"
  QT_VERSION: "6.7.2"

permissions:
  contents: write

jobs:
  # ── Apple Silicon (arm64) ─────────────────────────────────────────────────
  build-arm64:
    name: macOS Apple Silicon (arm64)
    runs-on: macos-14   # M1 runner
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: brew install ninja cmake

      - name: Install Qt6 (cached)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Fetch OBS headers (sparse — no full build needed)
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch ${{ env.OBS_VERSION }} \
            https://github.com/obsproject/obs-studio.git /tmp/obs-studio
          cd /tmp/obs-studio
          git sparse-checkout set libobs UI/obs-frontend-api
          mkdir -p build_universal/config

      - name: Configure PodSwitch
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DOBS_SOURCE_DIR=/tmp/obs-studio \
            -DCMAKE_PREFIX_PATH="${Qt6_DIR}"

      - name: Build
        run: cmake --build build -v

      - name: Create .pkg installer
        run: |
          PLUGIN="$RUNNER_TEMP/stage/Library/Application Support/obs-studio/plugins/podswitch.plugin"
          mkdir -p "$PLUGIN/Contents/MacOS" "$PLUGIN/Contents/Resources"
          find build -name "*.so" -exec cp {} "$PLUGIN/Contents/MacOS/" \;
          cp -r data/. "$PLUGIN/Contents/Resources/"
          pkgbuild \
            --root "$RUNNER_TEMP/stage" \
            --identifier com.podswitch.podswitch \
            --version 1.1.0 \
            --install-location / \
            PodSwitch-1.1.0-macos-arm64.pkg

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v7
        with:
          name: PodSwitch-macos-arm64
          path: PodSwitch-1.1.0-macos-arm64.pkg

  # ── Attach .pkg to GitHub Release ─────────────────────────────────────────
  release-artifacts:
    name: Attach to Release
    runs-on: ubuntu-latest
    needs: build-arm64
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PodSwitch-macos-arm64
          path: installers
      - name: List installers
        run: find installers -name "*.pkg" | sort
      - uses: softprops/action-gh-release@v3
        with:
          files: installers/*.pkg
